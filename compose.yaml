name: retailflow
services:
  app:
    build: .
    image: retailflow:1.0.0
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3086:3000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
