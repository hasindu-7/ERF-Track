server {
    listen 80;
    listen [::]:80;
    server_name erftrack.totalclient.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/retailflow-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erftrack.totalclient.xyz;
    ssl_certificate /etc/letsencrypt/live/erftrack.totalclient.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erftrack.totalclient.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
