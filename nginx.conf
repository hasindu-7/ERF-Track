# Optional PHP-FPM example for a server administrator; cPanel users do not need it.
# Issue the subdomain certificate first and adjust the PHP-FPM socket/version.
server {
    listen 80;
    server_name erftrack.totalclient.xyz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name erftrack.totalclient.xyz;
    ssl_certificate /etc/letsencrypt/live/erftrack.totalclient.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erftrack.totalclient.xyz/privkey.pem;
    root /opt/erf-track/public;
    index index.php;
    client_max_body_size 64k;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/(index|install)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { deny all; }
    location ~ /\. { deny all; }
    location ^~ /app-private/ { deny all; }
}
